services:
  ingest:
    build: ./ingest
    network_mode: host
    volumes:
      - /opt/fde/obsidian/fde-vault:/vault:ro
    environment:
      VAULT_PATH: /vault
      QDRANT_URL: http://localhost:6333
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      EMBED_PORT: "7910"
    restart: unless-stopped

  rag:
    build: ./rag
    network_mode: host
    environment:
      EMBED_URL: http://localhost:7910
      QDRANT_URL: http://localhost:6333
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      QWEN_URL: http://192.168.100.10:8001/v1
      QWEN_MODEL: Qwen/Qwen3.8-27B-FP8
      SPARK_VLLM_API_KEY: ${SPARK_VLLM_API_KEY:-local-dummy}
      PORT: "7900"
    restart: unless-stopped
    depends_on:
      - ingest
